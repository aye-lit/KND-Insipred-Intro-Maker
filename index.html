<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KND Inspired Video Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ui-bg: #111; --ui-panel: #181818; --ui-line: #333;
    --ui-text: #eee; --ui-muted: #999; --accent: #00ff66;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; color: #fff; overflow: hidden; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

  .toolbar {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; transition: opacity .3s; flex-wrap: nowrap;
  }
  .btn {
    font: 600 15px/1 "Inter", system-ui, sans-serif; white-space: nowrap;
    background: var(--ui-bg); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 999px;
    padding: 11px 18px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn[hidden] { display: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden-ui .toolbar, .hidden-ui .panel { opacity: 0; pointer-events: none; }

  .status {
    position: fixed; z-index: 11; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top, 0px));
    background: rgba(17,17,17,.92); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 999px;
    padding: 8px 16px; font-size: 14px; max-width: 92vw; text-align: center;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .status.show { opacity: 1; }
  .status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; margin-right: 7px; vertical-align: 0; }

  .panel {
    position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: min(420px, 100vw);
    background: var(--ui-panel); color: var(--ui-text); border-left: 1px solid var(--ui-line);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(90px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; transform: translateX(105%); transition: transform .3s ease, opacity .3s;
  }
  .panel.open { transform: none; }
  .panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .panel h2 { font: 600 18px "Inter", sans-serif; margin: 0; }
  .panel p.note { color: var(--ui-muted); font-size: 13px; margin: 4px 0 14px; line-height: 1.45; }
  fieldset { border: 1px solid var(--ui-line); border-radius: 12px; padding: 12px 14px 14px; margin: 0 0 14px; }
  legend { padding: 0 6px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  label { display: block; font-size: 13px; color: var(--ui-muted); margin: 10px 0 5px; }
  input[type=text], textarea, select {
    width: 100%; background: #0c0c0c; color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 8px; padding: 9px 10px; font: 15px "Inter", sans-serif;
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .row[hidden] { display: none; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ui-text); font-size: 14px; margin-top: 10px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 36px; border: 1px solid var(--ui-line); background: none; border-radius: 8px; padding: 2px; flex: 0 0 44px; }
  .preview {
    position: sticky; top: calc(-18px - env(safe-area-inset-top, 0px)); z-index: 2;
    background: var(--ui-panel); margin: 0 -20px 14px; padding: 10px 20px 12px;
    border-bottom: 1px solid var(--ui-line);
  }
  #mini { display: block; width: 100%; max-height: 34vh; object-fit: contain; background: #000; border: 1px solid var(--ui-line); border-radius: 8px; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button {
    flex: 1; font: 600 13px "Inter", sans-serif; padding: 8px 6px; border-radius: 8px; cursor: pointer;
    background: #0c0c0c; color: var(--ui-muted); border: 1px solid var(--ui-line);
  }
  .tabs button[aria-pressed="true"] { color: #000; background: var(--accent); border-color: var(--accent); }
  .preview .off { color: var(--ui-muted); font-size: 12px; margin-top: 6px; min-height: 1em; }
  .mcolors { display: grid; gap: 8px; margin-bottom: 8px; }
  .mrow input[type=color] { width: 36px; flex: none; }
  .mrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1.5fr) 2.2em 26px; align-items: center; gap: 8px;
    background: #0c0c0c; border: 1px solid var(--ui-line); border-radius: 8px; padding: 4px 10px 4px 4px; font-size: 14px; }
  .mrow .nm { min-width: 0; padding: 6px 8px; font-size: 14px; }
  .mrow .del { background: none; border: none; color: var(--ui-muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px; border-radius: 6px; }
  .mrow .del:focus-visible { outline: 2px solid var(--accent); }
  .mrow output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ui-muted); }
  /* while editing: big preview on top, settings underneath */
  :root { --pv-h: 58vh; }
  @media (max-width: 699px) { :root { --pv-h: 46vh; } }
  body.editing #mini { display: none; }
  body.editing #stage { bottom: auto; height: calc(var(--pv-h) - 64px); }
  body.editing .panel {
    top: var(--pv-h); width: 100vw; left: 0; right: 0;
    border-left: none; border-top: 1px solid var(--ui-line);
    padding-top: 0; transform: none;
  }
  body.editing .preview { top: 0; padding-top: 12px; }
  body.editing .panel > * { max-width: 1100px; margin-left: auto; margin-right: auto; }
  body.editing .panel > .preview { margin-left: -20px; margin-right: -20px; max-width: none; padding-left: max(20px, calc((100vw - 1100px) / 2)); padding-right: max(20px, calc((100vw - 1100px) / 2)); }
  body.editing .panel header { padding-top: 12px; }
  body.editing .toolbar { top: calc(var(--pv-h) - 56px); bottom: auto; }
  /* one settings section at a time, packed tight so it fits without scrolling */
  .fields > fieldset:not(.on) { display: none; }
  body.editing .panel header { display: none; }
  body.editing .panel .preview { margin-bottom: 12px; }
  .tabs button { padding: 8px 2px; }
  .panel fieldset { margin: 0; padding: 10px 14px 14px; }
  .panel fieldset label { margin: 8px 0 4px; }
  .panel fieldset .check { margin-top: 8px; }
  .panel .mcolors { gap: 6px; }
  .panel .mrow .nm { padding: 4px 8px; }
  .panel textarea.tbox { min-height: 166px; }   /* briefing and model heading boxes: same size, 7 lines */
  /* wide screens: preview on the left, settings in their own scrolling column on the right */
  @media (min-width: 900px) {
    :root { --set-w: clamp(400px, 36vw, 540px); }
    body.editing #stage { top: 0; left: 0; right: auto; bottom: auto; width: calc(100vw - var(--set-w)); height: calc(100% - 84px); }
    body.editing .panel {
      top: 0; bottom: 0; left: auto; right: 0; width: var(--set-w);
      border-top: none; border-left: 1px solid var(--ui-line);
      padding-bottom: 16px;
    }
    body.editing .panel > * { max-width: none; }
    body.editing .panel > .preview { margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; }
    body.editing .toolbar { top: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: calc((100vw - var(--set-w)) / 2); }
  }
  .preview .off:empty { display: none; }
  .bladecols { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .bladecols label { margin: 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; }
  .bladecols input[type=color] { width: 34px; height: 30px; flex: none; }
  .vbar { height: 6px; background: #262626; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .vbar[hidden] { display: none; }
  .vbar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
  .vbar.busy i { width: 35% !important; animation: vbarslide 1.1s ease-in-out infinite; }
  @keyframes vbarslide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .vbar.busy i { animation: none; width: 100% !important; opacity: .5; } }
  .panel fieldset[data-part] { position: relative; }
  .partplay { position: absolute; top: -9px; right: 12px; font: 600 12px "Inter", sans-serif; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    background: var(--ui-panel); color: var(--accent); border: 1px solid var(--accent); }
  .partplay:hover { background: var(--accent); color: #000; }
  .partplay[aria-pressed="true"] { background: var(--accent); color: #000; }
  label.hasval { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  label .val { color: var(--ui-text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .file { font-size: 13px; color: var(--ui-muted); margin-top: 6px; }
  .reset { background: none; border: none; color: var(--ui-muted); text-decoration: underline; cursor: pointer; font: 13px "Inter", sans-serif; padding: 0; }
  @media (prefers-reduced-motion: reduce) { .panel, .toolbar, .status { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Intro preview"></canvas>
<div class="status" id="status" role="status" aria-live="polite"></div>

<div class="toolbar">
  <button class="btn primary" id="playBtn" type="button">▶ Play</button>
  <button class="btn" id="saveBtn" type="button" hidden>⬇ Save MP4</button>
  <button class="btn" id="editBtn" type="button">Edit</button>
</div>
<aside class="panel ui" id="panel" aria-label="Template settings">
  <header>
    <h2>Edit intro</h2>
    <button class="btn" id="closeBtn" type="button">Done</button>
  </header>
  <div class="preview">
    <canvas id="mini" aria-label="Live preview of your changes"></canvas>
    <div class="tabs" role="group" aria-label="Preview part">
      <button type="button" data-tab="title" data-pv="1" aria-pressed="true">Title</button>
      <button type="button" data-tab="brief" data-pv="2" aria-pressed="false">Briefing</button>
      <button type="button" data-tab="model" data-pv="3" aria-pressed="false">Model</button>
      <button type="button" data-tab="meters" data-pv="3" aria-pressed="false">Meters</button>
      <button type="button" data-tab="trans" aria-pressed="false">Transition</button>
      <button type="button" data-tab="video" aria-pressed="false">Video</button>
    </div>
    <div class="off" id="pvNote"></div>
  </div>

  <div class="fields">
  <fieldset data-tab="video">
    <legend>Text font</legend>
    <select id="f-font" aria-label="Text font"></select>
    <label for="f-fontfile">Or upload your own font (.ttf, .otf, .woff, .woff2)</label>
    <input id="f-fontfile" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2">
    <div class="file" id="fontNote" role="status"></div>
  </fieldset>

  <fieldset data-tab="trans" data-part="t">
    <legend>Transition between parts</legend>
    <button class="partplay" type="button" data-play="t" aria-label="Play just the transition">▶ Play transition</button>
    <label for="f-trans">Style</label>
    <select id="f-trans" data-k="trans">
      <option value="iris">Iris blades</option>
      <option value="none">None (straight cut)</option>
    </select>
    <div id="irisOpts">
      <label>Where it plays</label>
      <div class="row" style="gap:18px">
        <label class="check" style="flex:0 0 auto;margin:0"><input type="checkbox" data-k="tAfter1"> After the title card</label>
        <label class="check" style="flex:0 0 auto;margin:0"><input type="checkbox" data-k="tAfter2"> After the briefing</label>
      </div>
      <label for="f-tsound">Sound</label>
      <select id="f-tsound" data-k="tsound">
        <option value="whir">Sound 1</option>
        <option value="micro">Sound 2</option>
        <option value="hobby">Sound 3</option>
        <option value="industrial">Sound 4</option>
        <option value="twin">Sound 5</option>
        <option value="file">My own sound</option>
        <option value="none">No sound</option>
      </select>
      <div id="tfileRow" hidden>
        <label for="f-tfile">Sound file (.mp3, .wav, .m4a, .ogg) — starts as the blades begin to close</label>
        <input id="f-tfile" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg">
        <div class="file" id="tfileNote" role="status">No file chosen yet.</div>
      </div>
      <label for="f-irisspeed">Speed</label>
      <input id="f-irisspeed" type="range" min="0.4" max="2.5" step="0.05" data-k="irisSpeed">
      <div class="row">
        <div style="flex:0 0 auto"><label for="f-irisc">Blade color</label><input id="f-irisc" type="color" data-k="irisC"></div>
        <div style="flex:0 0 auto"><label for="f-irise">Edge color</label><input id="f-irise" type="color" data-k="irisE"></div>
        <div></div>
      </div>
      <label class="check"><input type="checkbox" data-k="irisEach"> Pick a color for each blade</label>
      <div id="bladeCols" hidden>
        <div class="bladecols" id="bladeColList" role="group" aria-label="Color for each blade"></div>
        <button class="reset" type="button" id="matchBlades">Match all to the blade color</button>
      </div>
      <button class="reset" type="button" id="resetIris">Reset to gunmetal</button>
    </div>
  </fieldset>

  <fieldset data-tab="video">
    <legend>Video size</legend>
    <select id="f-format" data-k="format" aria-label="Video size">
      <option value="land">Landscape 1920 × 1080</option>
      <option value="port">Portrait 1080 × 1920</option>
    </select>
  </fieldset>

  <fieldset data-part="1" data-tab="title" class="on">
    <legend><input type="checkbox" data-k="s1on" aria-label="Include title card"> 1 · Title card</legend>
    <button class="partplay" type="button" data-play="1" aria-label="Play just the title card">▶ Play this part</button>
    <label for="f-top">Top line</label>
    <input id="f-top" type="text" data-k="top">
    <label for="f-label">Label</label>
    <input id="f-label" type="text" data-k="label">
    <label for="f-title">Title</label>
    <input id="f-title" type="text" data-k="title">
    <label class="check"><input type="checkbox" data-k="dots"> Add dots between letters (g.u.m…)</label>
    <div class="row">
      <div><label for="f-tx">Text ← →</label><input id="f-tx" type="range" min="-45" max="45" step="1" data-k="tX"></div>
      <div><label for="f-ty">Text ↑ ↓</label><input id="f-ty" type="range" min="-45" max="45" step="1" data-k="tY"></div>
    </div>
    <button class="reset" type="button" data-reset="tX,tY">Reset text position</button>
  </fieldset>

  <fieldset data-part="2" data-tab="brief">
    <legend><input type="checkbox" data-k="s2on" aria-label="Include briefing"> 2 · Briefing</legend>
    <button class="partplay" type="button" data-play="2" aria-label="Play just the briefing">▶ Play this part</button>
    <label for="f-brief">Text — each line types on its own row</label>
    <textarea id="f-brief" data-k="brief" class="tbox"></textarea>
    <div class="row">
      <div><label for="f-bx">Text ← →</label><input id="f-bx" type="range" min="-45" max="45" step="1" data-k="bX"></div>
      <div><label for="f-by">Text ↑ ↓</label><input id="f-by" type="range" min="-45" max="45" step="1" data-k="bY"></div>
    </div>
    <button class="reset" type="button" data-reset="bX,bY">Reset text position</button>
    <label class="check"><input type="checkbox" data-k="voice"> A voice reads the briefing</label>
    <div class="row">
    <div>
    <label for="f-vtype">Voice</label>
    <select id="f-vtype" data-k="vtype">
      <option value="human">Human-like AI voice</option>
      <option value="robot">Robotic AI voice</option>
      <option value="natural">Original voice (your device's voice, preview only)</option>
      <option value="file">My own recording</option>
    </select>
    </div>
    <div>
    <label for="f-bspeed">Speed</label>
    <input id="f-bspeed" type="range" min="0.5" max="2" step="0.05" data-k="bspeed">
    </div>
    </div>
    <div class="row" id="humanRow">
      <div>
        <label for="f-hvoice">Human-like voice</label>
        <select id="f-hvoice" data-k="hvoice">
          <option value="af_heart">Heart (woman, warm)</option>
          <option value="af_bella">Bella (woman, lively)</option>
          <option value="af_nicole">Nicole (woman, soft)</option>
          <option value="af_aoede">Aoede (woman, smooth)</option>
          <option value="af_kore">Kore (woman, steady)</option>
          <option value="af_sarah">Sarah (woman, calm)</option>
          <option value="af_nova">Nova (woman, crisp)</option>
          <option value="bf_emma">Emma (British woman)</option>
          <option value="bf_isabella">Isabella (British woman)</option>
          <option value="am_michael">Michael (man, friendly)</option>
          <option value="am_fenrir">Fenrir (man, deep)</option>
          <option value="am_puck">Puck (man, upbeat)</option>
          <option value="bm_george">George (British man)</option>
          <option value="bm_fable">Fable (British man)</option>
        </select>
      </div>
      <div>
        <label for="f-robo">Robotic</label>
        <input id="f-robo" type="range" min="0" max="100" step="5" data-k="robo">
      </div>
    </div>
    <div id="robotRow" hidden>
      <label for="f-rvoice">Robotic voice</label>
      <select id="f-rvoice" data-k="rvoice">
        <option value="classic">Classic computer</option>
        <option value="tin">Tin droid</option>
        <option value="mainframe">Deep mainframe</option>
        <option value="glitch">Glitch bot</option>
        <option value="radio">Radio bot</option>
        <option value="tiny">Tiny bot</option>
      </select>
    </div>
    <div id="vfileRow" hidden>
      <label for="f-vfile">Voice-over file (.mp3, .wav, .m4a)</label>
      <input id="f-vfile" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg">
    </div>
    <div class="row">
      <button class="btn" id="testVoice" type="button" style="flex:0 0 auto">▶ Test voice</button>
      <div class="file" id="voiceNote" role="status" style="margin:0">Tap Test voice to hear it.</div>
    </div>
    <div class="vbar" id="vbar" hidden><i></i></div>
  </fieldset>

  <fieldset data-part="3" data-tab="model">
    <legend><input type="checkbox" data-k="s3on" aria-label="Include model reveal"> 3 · Model reveal</legend>
    <button class="partplay" type="button" data-play="3" aria-label="Play just the model reveal">▶ Play this part</button>
    <label for="f-head">Heading — each line on its own row</label>
    <textarea id="f-head" data-k="head" class="tbox"></textarea>
    <label for="f-file">Model file (.stl, .obj or .glb)</label>
    <input id="f-file" type="file" accept=".stl,.obj,.glb">
    <div class="file" id="fileName">Using placeholder cube</div>
    <div class="row">
      <div>
        <label for="f-view">Starting view</label>
        <select id="f-view" data-k="view">
          <option value="front">Front</option>
          <option value="back">Back</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
        </select>
      </div>
      <div>
        <label for="f-tilt">Camera tilt</label>
        <input id="f-tilt" type="range" min="0" max="60" step="1" data-k="tilt">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="f-mscale">Model size</label>
        <input id="f-mscale" type="range" min="30" max="200" step="5" data-k="mscale">
      </div>
      <div>
        <label for="f-bg">Background</label>
        <select id="f-bg" data-k="bg">
          <option value="grid">Gray grid</option>
          <option value="black">Plain black</option>
          <option value="key">Green screen (for keying)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label for="f-mx">Model ← →</label><input id="f-mx" type="range" min="-45" max="45" step="1" data-k="mX"></div>
      <div><label for="f-my">Model ↑ ↓</label><input id="f-my" type="range" min="-45" max="45" step="1" data-k="mY"></div>
    </div>
    <div class="row">
      <div><label for="f-hx">Heading text ← →</label><input id="f-hx" type="range" min="-45" max="45" step="1" data-k="hX"></div>
      <div><label for="f-hy">Heading text ↑ ↓</label><input id="f-hy" type="range" min="-10" max="85" step="1" data-k="hY"></div>
    </div>
    <button class="reset" id="resetModelPos" type="button">Reset model and text positions</button>
    <div class="row">
      <div>
        <label for="f-spin">Full turn time</label>
        <input id="f-spin" type="range" min="3" max="15" step="0.5" data-k="turn">
      </div>
      <div style="flex:0 0 auto">
        <label for="f-color">Line color</label>
        <input id="f-color" type="color" data-k="color">
      </div>
    </div>
  </fieldset>

  <fieldset data-part="3" data-tab="meters">
    <legend><input type="checkbox" data-k="statsOn" aria-label="Show stat meters"> Stat meters</legend>
    <button class="partplay" type="button" data-play="3" aria-label="Play just the model reveal with meters">▶ Play this part</button>

<script>
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var redraw = 0; function markDirty() { redraw++; }   // tells the idle preview to redraw
  // fonts for the on-screen text: [label, family, weight]. All free Google Fonts.
  const FONTS = {
    exo2: ['Exo 2 (default)', 'Exo 2', 600],
    orbitron: ['Orbitron', 'Orbitron', 600],
    oxanium: ['Oxanium', 'Oxanium', 600],
    rajdhani: ['Rajdhani', 'Rajdhani', 600],
    chakra: ['Chakra Petch', 'Chakra Petch', 600],
    audiowide: ['Audiowide', 'Audiowide', 400],
    russo: ['Russo One', 'Russo One', 400],
    bungee: ['Bungee', 'Bungee', 400],
    montserrat: ['Montserrat', 'Montserrat', 600],
    sharetech: ['Share Tech Mono', 'Share Tech Mono', 400],
    spacemono: ['Space Mono', 'Space Mono', 700],
    robotomono: ['Roboto Mono', 'Roboto Mono', 600],
    vt323: ['VT323 (pixel terminal)', 'VT323', 400],
    press: ['Press Start 2P (pixel)', 'Press Start 2P', 400],
    marker: ['Permanent Marker', 'Permanent Marker', 400]
  };
  const CUSTOM_FAMILY = 'Intro Custom Font';
  let customFontName = '';
  let FONT = '"Exo 2", "Trebuchet MS", Arial, sans-serif', FONT_W = 600;

  // ---------- settings ----------
  const DEFAULTS = {
    format: 'land',
    s1on: true, top: 'ayelit presents', label: 'operation:', title: 'gumzooka', dots: true,
    s2on: true, brief: 'warning -\nsticky\ngum\nlauncher -\nhandle\nwith\ncare.',
    s3on: true, head: 'model\nfile -\ng.u.m.z.o.o.k.a.', statsOn: true, meterColors: [], layout: 'group', pwX: 0, pwY: 0, grX: 0, grY: 0, stats: 'power: 85\nrange: 60\nstability: 72\naccuracy: 90\nspeed: 55', bg: 'grid', turn: 6, view: 'front', tilt: 20, mscale: 100, zones: true, z1: '#4fc3ff', z2: '#b06bff', z3: '#ff4fa3', zLines: 4, color: '#39ff6a',
    speed: 1, hold: 1.4, voice: true, vtype: 'natural', bspeed: 1, headV2: true, trans: 'iris', tAfter1: true, tAfter2: true, tsound: 'whir', irisSpeed: 1, irisC: '#4c5159', irisE: '#c9d0d8', irisEach: false, irisCols: [], mX: 0, mY: 0, hX: 0, hY: 0, tX: 0, tY: 0, bX: 0, bY: 0, hvoice: 'af_heart', robo: 0, rvoice: 'classic', font: 'exo2',
    sfx: true, sfxVol: 0.7, musicVol: 0.6
  };
  let S = { ...DEFAULTS };
  try { Object.assign(S, JSON.parse(localStorage.getItem('intro-template') || '{}')); } catch (e) {}
  if (typeof S.statsOn !== 'boolean') { S.statsOn = DEFAULTS.statsOn; S.stats = DEFAULTS.stats; }
  for (const k of ['pwX','pwY','grX','grY','mX','mY','hX','hY','tX','tY','bX','bY']) if (typeof S[k] !== 'number') S[k] = 0;
  if (!Array.isArray(S.meterColors)) S.meterColors = [];
  if (!S.layout) { S.layout = DEFAULTS.layout; if (S.stats === 'power: 85\nrange: 60\nstability: 72\naccuracy: 90') S.stats = DEFAULTS.stats; }
  if (typeof S.mscale !== 'number') S.mscale = 100;
  if (typeof S.voice !== 'boolean') S.voice = true;
  if (!S.vtype) S.vtype = 'natural';
  if (S.vtype === 'computer') S.vtype = 'robot';
  if (!S.hvoice) S.hvoice = 'af_heart';
  if (typeof S.robo !== 'number') S.robo = 0;
  if (typeof S.bspeed !== 'number') S.bspeed = 1;
  if (!S.trans) S.trans = 'iris';
  if (typeof S.irisSpeed !== 'number') S.irisSpeed = 1;
  if (!S.tsound) S.tsound = 'whir';
  if (typeof S.tAfter1 !== 'boolean') S.tAfter1 = true;
  if (typeof S.tAfter2 !== 'boolean') S.tAfter2 = true;
  if (!S.irisC) S.irisC = '#4c5159';
  if (!S.irisE) S.irisE = '#c9d0d8';
  if (!Array.isArray(S.irisCols)) S.irisCols = [];
  if (typeof S.irisEach !== 'boolean') S.irisEach = false;
  if (typeof S.zLines !== 'number') S.zLines = 4;
  // the model heading used to add the title under it automatically; now it's all in the box (keeps what was on screen)
  if (!S.headV2) {
    const tt = S.dots ? S.title.replace(/\s+/g, '').split('').join('.') + '.' : S.title;
    if (S.headTitle !== false && S.title.trim()) S.head = S.head.replace(/\s+$/, '') + '\n' + tt;
    S.headV2 = true; delete S.headTitle;
  }
  if (!S.rvoice) S.rvoice = 'classic';
  if (typeof S.zones !== 'boolean') { S.zones = DEFAULTS.zones; S.z1 = DEFAULTS.z1; S.z2 = DEFAULTS.z2; S.z3 = DEFAULTS.z3; }
  if (!S.view) S.view = 'front';
  if (typeof S.tilt !== 'number') S.tilt = 20;
  if (typeof S.turn !== 'number') S.turn = DEFAULTS.turn;
  delete S.spin;
  if (S.color === '#9a9a9a') S.color = DEFAULTS.color;
  S.sfx = true; S.sfxVol = 0.7; S.musicVol = 0.6; delete S.keys;
  const save = () => { try { localStorage.setItem('intro-template', JSON.stringify(S)); } catch (e) {} };

  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    const FMT = {
      speed: v => (+v).toFixed(1) + '×', hold: v => (+v).toFixed(1) + ' s', turn: v => (+v).toFixed(1) + ' s',
      tilt: v => v + '°', mscale: v => v + '%', robo: v => +v === 0 ? 'off' : v + '%', bspeed: v => (+v).toFixed(2).replace(/0$/, '') + '×', irisSpeed: v => (+v).toFixed(2).replace(/0$/, '') + '×',
      pwX: v => (v > 0 ? '+' : '') + v, mX: v => (v > 0 ? '+' : '') + v, tX: v => (v > 0 ? '+' : '') + v, tY: v => (v > 0 ? '+' : '') + v, bX: v => (v > 0 ? '+' : '') + v, bY: v => (v > 0 ? '+' : '') + v, mY: v => (v > 0 ? '+' : '') + v, hX: v => (v > 0 ? '+' : '') + v, hY: v => (v > 0 ? '+' : '') + v, pwY: v => (v > 0 ? '+' : '') + v, grX: v => (v > 0 ? '+' : '') + v, grY: v => (v > 0 ? '+' : '') + v
    };
    let val = null;
    if (el.type === 'range') {
      const lab = document.querySelector('label[for="' + el.id + '"]');
      if (lab) { lab.classList.add('hasval'); val = document.createElement('span'); val.className = 'val'; lab.appendChild(val); }
    }
    const show = () => { if (val) val.textContent = (FMT[k] || (v => v))(el.value); };
    el.addEventListener('input', show);
    const set = () => { if (el.type === 'checkbox') el.checked = !!S[k]; else el.value = S[k]; show(); };
    set(); el._set = set;
    el.addEventListener('input', () => {
      S[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? parseFloat(el.value) : el.value;
      save(); onSettingsChange(k);
    });
  });
  document.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
    for (const k of b.dataset.reset.split(',')) S[k] = 0;
    save(); document.querySelectorAll('[data-k]').forEach(el => el._set()); markDirty();
  }));
  $('resetIris').addEventListener('click', () => {
    S.irisSpeed = 1; S.irisC = DEFAULTS.irisC; S.irisE = DEFAULTS.irisE; S.irisEach = false; S.irisCols = []; buildBladeCols();
    save(); document.querySelectorAll('[data-k]').forEach(el => el._set()); TL = buildTimeline(); idleT = idleTime(); markDirty();
  });
  $('irisOpts').hidden = S.trans !== 'iris';
  // one color picker per blade (numbered 1-9, going around clockwise from the right)
  function buildBladeCols() {
    const box = $('bladeColList'); box.innerHTML = '';
    $('bladeCols').hidden = !S.irisEach;
    for (let i = 0; i < 9; i++) {
      const lab = document.createElement('label'), inp = document.createElement('input');
      inp.type = 'color'; inp.value = S.irisCols[i] || S.irisC; inp.setAttribute('aria-label', 'Blade ' + (i + 1) + ' color');
      inp.addEventListener('input', () => { for (let k = 0; k < 9; k++) if (!S.irisCols[k]) S.irisCols[k] = S.irisC; S.irisCols[i] = inp.value; save(); markDirty(); });
      lab.append(inp, document.createTextNode(String(i + 1))); box.append(lab);
    }
  }
  buildBladeCols();
  $('matchBlades').addEventListener('click', () => { S.irisCols = []; save(); buildBladeCols(); markDirty(); });
  $('tfileRow').hidden = S.tsound !== 'file';
  $('resetModelPos').addEventListener('click', () => {
    for (const k of ['mX','mY','hX','hY']) S[k] = 0;
    save(); document.querySelectorAll('[data-k]').forEach(el => el._set()); markDirty();
  });
  $('resetPos').addEventListener('click', () => {
    for (const k of ['pwX','pwY','grX','grY']) S[k] = 0;
    save(); document.querySelectorAll('[data-k]').forEach(el => el._set());
  });
  // meters live as a list; S.stats keeps them as "name: value" lines
  const getMeters = () => parseStats().map(st => ({ name: st.name, v: Math.round(st.v) }));
  function setMeters(list, rebuild) {
    S.stats = list.map(m => (m.name || 'meter') + ': ' + m.v).join('\n'); save();
    if (rebuild) buildColorPickers();
    if (!playing) { TL = buildTimeline(); idleT = idleTime(); }
  }
  function buildColorPickers() {
    const box = $('meterColors'); box.innerHTML = '';
    const list = getMeters();
    $('addMeter').disabled = list.length >= 6;
    if (!list.length) { box.textContent = 'No meters yet — tap + Add meter.'; return; }
    list.forEach((m, i) => {
      const st = { i };
      const row = document.createElement('div'); row.className = 'mrow';
      const col = document.createElement('input'); col.type = 'color';
      col.value = colorOf(st); col.setAttribute('aria-label', 'Color for ' + m.name);
      col.addEventListener('input', () => { S.meterColors[i] = col.value; save(); });
      const nm = document.createElement('input'); nm.type = 'text'; nm.className = 'nm'; nm.value = m.name;
      nm.setAttribute('aria-label', 'Meter name');
      nm.addEventListener('input', () => { const l = getMeters(); l[i].name = nm.value.replace(/[:\n]/g, '').trim(); setMeters(l, false); });
      const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 100; sl.step = 1;
      sl.value = m.v; sl.setAttribute('aria-label', 'Level for ' + m.name);
      const out = document.createElement('output'); out.textContent = m.v;
      sl.addEventListener('input', () => { out.textContent = sl.value; const l = getMeters(); l[i].v = +sl.value; setMeters(l, false); });
      const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '×';
      del.setAttribute('aria-label', 'Remove ' + m.name);
      del.addEventListener('click', () => {
        const l = getMeters(); l.splice(i, 1);
        S.meterColors.splice(i, 1);
        setMeters(l, true);
      });
      row.append(col, nm, sl, out, del); box.append(row);
    });
  }
  $('addMeter').addEventListener('click', () => {
    const l = getMeters(); if (l.length >= 6) return;
    l.push({ name: 'meter ' + (l.length + 1), v: 50 }); setMeters(l, true);
    const rows = document.querySelectorAll('.mrow .nm'); rows[rows.length - 1].focus(); rows[rows.length - 1].select();
  });
  $('matchColors').addEventListener('click', () => { S.meterColors = []; save(); buildColorPickers(); });
  $('resetBtn').addEventListener('click', () => {
    S = { ...DEFAULTS, meterColors: [] }; save(); buildColorPickers(); applyView(); buildFontMenu(); applyFont();
    document.querySelectorAll('[data-k]').forEach(el => el._set());
    onSettingsChange('format');
  });

  const titleText = () => S.dots ? S.title.replace(/\s+/g, '').split('').join('.') + '.' : S.title;
  const splitLines = txt => txt.split('\n').map(s => s.trim()).filter(Boolean);

  // ---------- canvas + 3D ----------
  const canvas = $('stage');
  const ctx = canvas.getContext('2d');
  let W = 1920, H = 1080;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.1, 100);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(3, 4, 5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.4); rim.position.set(-4, -2, -3); scene.add(rim);
  const model = new THREE.Group(); scene.add(model);
  const spinner = new THREE.Group(); model.add(spinner);
  const orient = new THREE.Group(); spinner.add(orient);
  const VIEWS = {
    front: [0, 0], back: [0, Math.PI], left: [0, Math.PI / 2],
    right: [0, -Math.PI / 2], top: [Math.PI / 2, 0], bottom: [-Math.PI / 2, 0]
  };
  function applyView() {
    const [x, y] = VIEWS[S.view] || VIEWS.front;
    orient.rotation.set(x, y, 0);
    spinner.rotation.x = THREE.MathUtils.degToRad(S.tilt);
  }
  applyView();
  // wireframe look: glowing lines over a dark fill that hides the back lines
  const material = new THREE.MeshBasicMaterial({ color: S.color, wireframe: true, transparent: true, opacity: 0.9 });
  const fillMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.85, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });

  function setSize() {
    [W, H] = S.format === 'port' ? [1080, 1920] : [1920, 1080];
    canvas.width = W; canvas.height = H;
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    const z = W < H ? 11 : 7;
    camera.position.set(0, 0, z);
    camera.updateProjectionMatrix();
    const visH = 2 * z * Math.tan(THREE.MathUtils.degToRad(17.5));
    model.position.y = visH * (W < H ? 0.14 : 0.1);
  }

  function setModel(obj, keepMaterials) {
    markDirty();
    orient.clear();
    const meshes = []; obj.traverse(o => { if (o.isMesh) meshes.push(o); });
    meshes.forEach(m => {
      m.material = fillMat;
      const wire = new THREE.Mesh(m.geometry, material);
      m.add(wire);
    });
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    const holder = new THREE.Group(); holder.add(obj);
    holder.scale.setScalar(2.2 / Math.max(size.x, size.y, size.z, 1e-6));
    orient.add(holder);
  }
  (function cube() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8, 6, 6, 6)));
    setModel(g, false);
  })();

  $('f-file').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    $('fileName').textContent = 'Loading ' + file.name + '…';
    reader.onerror = () => { $('fileName').textContent = 'Could not read that file.'; };
    reader.onload = () => {
      const ok = () => { $('fileName').textContent = 'Using ' + file.name + ' (re-upload after reloading the page)'; };
      const fail = () => { $('fileName').textContent = 'That file could not be loaded — try exporting it again.'; };
      try {
        if (ext === 'stl') {
          const geo = new THREE.STLLoader().parse(reader.result);
          geo.computeVertexNormals();
          const mesh = new THREE.Mesh(geo);
          mesh.rotation.x = -Math.PI / 2; // printer files are usually Z-up
          const g = new THREE.Group(); g.add(mesh);
          setModel(g, false); ok();
        } else if (ext === 'obj') {
          setModel(new THREE.OBJLoader().parse(reader.result), false); ok();
        } else if (ext === 'glb') {
          new THREE.GLTFLoader().parse(reader.result, '', gltf => { setModel(gltf.scene, true); ok(); }, fail);
        } else fail();
      } catch (err) { fail(); }
    };
    ext === 'obj' ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
  });

  // ---------- timeline ----------
  let TL = null;
  function buildTimeline() {
    const segs = []; let t = 0; const sp = S.speed, hold = S.hold * 1000;
    const add = (n, lines, delay, gap, mult = 1) => {
      const sp = S.speed * mult;
      const seg = { n, start: t, lines: [] }; let c = t + delay;
      for (const { text, block } of lines) {
        const line = { text, block, t0: c, times: [] };
        for (const ch of line.text) { line.times.push(c); c += (ch === '.' ? 110 : 75) / sp; }
        seg.lines.push(line); c += gap / sp;
      }
      seg.typedEnd = c; return seg;
    };
    if (S.s1on) {
      const lines = [];
      if (S.top.trim()) lines.push({ text: S.top.trim(), block: 0 });
      if (S.label.trim()) lines.push({ text: S.label.trim(), block: 1 });
      if (S.title.trim()) lines.push({ text: titleText(), block: 1 });
      const seg = add(1, lines, 500, 350); seg.end = seg.typedEnd + hold; segs.push(seg); t = seg.end;
    }
    // between parts the iris closes over the old part, holds shut, then opens on the new one
    const trans = [];
    const transGap = () => {
      if (S.trans !== 'iris' || !segs.length) return;
      const after = segs[segs.length - 1].n;   // the part the transition would follow
      if ((after === 1 && !S.tAfter1) || (after === 2 && !S.tAfter2)) return;
      trans.push(t); t += IRIS.close + IRIS.hold;
    };
    if (S.s2on) {
      transGap();
      const clips = S.voice && isAIVoice() ? voiceClips() : null;
      let seg;
      if (S.voice && S.vtype === 'natural' && window.speechSynthesis) {
        // original voice says each line as the line types, so text and voice stay in step line by line.
        // Each line types for as long as the voice took to say it last time (measured), or an estimate the first time.
        seg = { n: 2, start: t, lines: [] }; let c = t + 400;
        splitLines(S.brief).forEach((text, i) => {
          const tx = text, say = lineSpeech(text).toLowerCase();
          const words = say.split(/\s+/).filter(Boolean).length;
          const bs = S.bspeed || 1;
          const pause = (/[-,.!?:;]\s*$/.test(text) ? 200 : 90) / bs;
          const measured = say ? natTimes.get(natKey(say)) : null;
          const dur = measured || Math.max(words * 330, tx.length * 30) / bs;
          const line = { text: tx, block: 0, t0: c, times: [], say: say || null };
          for (let k = 0; k < tx.length; k++) line.times.push(c + dur * k / tx.length);
          seg.lines.push(line); c += dur + pause;
        });
        seg.typedEnd = c;
      } else if (clips) {
        // each line types out exactly as long as its spoken clip lasts
        seg = { n: 2, start: t, lines: [] }; let c = t + 400;
        splitLines(S.brief).forEach((text, i) => {
          const tx = text, clip = clips[i];
          const dur = clip ? Math.max(clip.duration * 1000, tx.length * 30 / S.bspeed) : tx.length * 75 / (sp * S.bspeed);
          const line = { text: tx, block: 0, t0: c, times: [], clip };
          for (let k = 0; k < tx.length; k++) line.times.push(c + dur * k / tx.length);
          seg.lines.push(line); c += dur + 250 / S.bspeed;
        });
        seg.typedEnd = c;
      } else seg = add(2, splitLines(S.brief).map(text => ({ text, block: 0 })), 400, 200, S.bspeed);
      seg.end = seg.typedEnd + hold;
      if (S.voice && S.vtype === 'file' && voiceFileBuf && seg.lines.length) {
        seg.fileAt = seg.lines[0].t0;

    const stream = new MediaStream([...video.getVideoTracks(), ...(recDest ? recDest.stream.getAudioTracks() : [])]);
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 192_000 });
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const rec = recorder;
    rec.onstop = async () => {
      video.getTracks().forEach(tr => tr.stop());
      recorder = null;
      if (rec._cancelled) { status('Recording stopped.', 2500); return; }
      const blob = new Blob(chunks, { type: mime.split(';')[0] });
      const name = (S.title.trim() || 'intro').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-intro.' + ext;
      status('Saving video…');
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        status(ext === 'mp4' ? 'Saved ' + name : 'Saved ' + name + " — this browser can't make MP4; use Chrome, Edge or Safari for MP4.", 5000);
      } catch (err) { status("Saving isn't available in this browser.", 4000); }
    };
    status('<span class="dot"></span>Recording — keep this screen open');
    rec.start(250);
    // draw the first frame before timing starts so the video doesn't open on a stale frame
    play(() => { setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 300); });
  }

  $('playBtn').addEventListener('click', () => playWithVoice());
  // ▶ Play this part: plays just that section in the preview, settings stay open; press again to stop
  document.querySelectorAll('.partplay').forEach(b => { b.dataset.label = b.textContent; });
  document.querySelectorAll('.partplay').forEach(b => b.addEventListener('click', async () => {
    if (b.getAttribute('aria-pressed') === 'true') { stop(); return; }
    stop();
    if (b.dataset.play === 't') { playTransition(b); return; }
    const n = +b.dataset.play;
    audio(); if (actx && actx.state === 'suspended') actx.resume();
    unlockAudio();
    b.setAttribute('aria-pressed', 'true'); b.textContent = '■ Stop';
    await fontReady;
    if (n === 2) { const was = S.s2on; S.s2on = true; await waitForVoice(); S.s2on = was; }
    if (b.getAttribute('aria-pressed') !== 'true') return;   // stopped while getting ready
    play(() => { b.setAttribute('aria-pressed', 'false'); b.textContent = b.dataset.label; }, n);
  }));
  // ▶ Play transition: plays just the first transition (a moment before, the blades, a moment after), with its sound
  function playTransition(b) {
    TL = buildTimeline();
    if (!TL.trans.length) { status(S.trans === 'none' ? 'The transition is off. Pick Iris blades first.' : TL.segs.length < 2 ? 'Turn on at least two parts to see the transition.' : 'Tick where the transition should play (after the title card or after the briefing).', 3500); return; }
    const T = TL.trans[0], from = Math.max(0, T - 500), to = T + IRIS.close + IRIS.hold + IRIS.open + 600;
    silence();
    const ac = audio(); unlockAudio();
    const lead = 0.08;
    if (ac) { if (ac.state === 'suspended') ac.resume(); irisSound(ac.currentTime + lead + (T - from) / 1000); }
    playStart = performance.now() + lead * 1000 - from; playEnd = to;
    playing = true;
    b.setAttribute('aria-pressed', 'true'); b.textContent = '■ Stop';
    onDone = () => { b.setAttribute('aria-pressed', 'false'); b.textContent = b.dataset.label; idleT = idleTime(); };
  }
  const syncVoiceUI = (initial) => {
    $('vfileRow').hidden = S.vtype !== 'file';
    $('humanRow').hidden = S.vtype !== 'human';
    $('robotRow').hidden = S.vtype !== 'robot';
    if (S.vtype === 'human' && humanPct < 100 && humanTTS) setVBar('Downloading the voices (one time only)… ' + humanPct + '%', humanPct / 100);
    else { hideVBar(); $('voiceNote').textContent = 'Tap Test voice to hear it.'; }
    if (initial) return;
    if (S.vtype === 'human' && S.voice) loadHumanEngine();
    prepSoon();
  };
  $('f-vtype').addEventListener('input', () => syncVoiceUI());
  $('f-vfile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    const ac = audio(); if (!ac) return;
    $('voiceNote').textContent = 'Loading ' + f.name + '…';
    try {
      const data = await f.arrayBuffer();
      voiceFileBuf = await new Promise((res, rej) => ac.decodeAudioData(data, res, rej));
      $('voiceNote').textContent = 'Using ' + f.name + ' (' + voiceFileBuf.duration.toFixed(1) + ' s). Re-add it after reloading the page.';
      if (!playing) { TL = buildTimeline(); idleT = idleTime(); }
    } catch (err) { voiceFileBuf = null; $('voiceNote').textContent = "That audio file couldn't be read. Try an MP3 or WAV."; }
  });
  syncVoiceUI(true);
  $('testVoice').addEventListener('click', async () => {
    const ac = audio(); if (!ac) return;
    unlockAudio();
    silence();
    if (S.vtype === 'natural') {
      if (!window.speechSynthesis) { $('voiceNote').textContent = "This browser has no built-in voice. Pick an AI voice instead."; return; }
      speechSynthesis.cancel();
      splitLines(S.brief).forEach(l => { const say = lineSpeech(l).toLowerCase(); if (say) browserSpeak(say, true); });
      const v = pickNaturalVoice();
      $('voiceNote').textContent = 'Using ' + (v ? v.name : 'your device voice') + '. It plays in preview; for the MP4 use an AI voice or your own recording.';
      return;
    }
    if (S.vtype === 'file') {
      if (!voiceFileBuf) { $('voiceNote').textContent = 'Choose a voice-over file first.'; return; }
      if (ac.state !== 'running') await ac.resume();
      const src = keep(ac.createBufferSource()); src.buffer = voiceFileBuf; src.connect(master); src.start(ac.currentTime + 0.05);
      $('voiceNote').textContent = 'Playing your recording (' + voiceFileBuf.duration.toFixed(1) + ' s).';
      return;
    }
    if (!voiceClips()) setVBar('Making the voice…', null);
    const was = S.voice; S.voice = true;
    const ok = await prepareVoice(); S.voice = was;
    if (ok && voiceClips()) {
      if (ac.state !== 'running') await ac.resume();
      let at = ac.currentTime + 0.05;
      for (const b of voiceClips()) if (b) { speakAt(at, b); at += b.duration + 0.25; }
    }
  });
  $('saveBtn').addEventListener('click', exportVideo);
  $('editBtn').addEventListener('click', () => {
    if (panelOpen()) { $('closeBtn').click(); return; }
    stop(); $('panel').classList.add('open'); setPreview(pvPart);
  });
  $('closeBtn').addEventListener('click', () => { $('panel').classList.remove('open'); TL = buildTimeline(); idleT = idleTime(); });
  document.addEventListener('pointerdown', e => { if (playing && !e.target.closest('.toolbar') && !e.target.closest('.panel')) stop(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });

  // ---------- fonts ----------
  let fontReady = Promise.resolve();
  const fontLinks = {};
  function applyFont() {
    const f = S.font === 'custom' && customFontName ? null : (FONTS[S.font] || FONTS.exo2);
    const fam = f ? f[1] : CUSTOM_FAMILY, w = f ? f[2] : 400;
    FONT = `"${fam}", "Trebuchet MS", Arial, sans-serif`; FONT_W = w;
    if (f && !fontLinks[fam]) {
      const l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + fam.replace(/ /g, '+') + ':wght@' + w + '&display=swap';
      document.head.appendChild(l); fontLinks[fam] = l;
    }
    const want = `${w} 64px "${fam}"`;
    fontReady = (document.fonts ? new Promise(res => {
      const tryLoad = (n) => document.fonts.load(want).then(r => (r.length || n <= 0) ? res() : setTimeout(() => tryLoad(n - 1), 150)).catch(() => res());
      tryLoad(20);
    }) : Promise.resolve()).then(() => { if (!playing) { TL = buildTimeline(); idleT = idleTime(); } });
    $('fontNote').textContent = S.font === 'custom'
      ? (customFontName ? 'Using your font: ' + customFontName : 'Upload your font file again to use it.')
      : '';
  }
  function buildFontMenu() {
    const sel = $('f-font'); sel.innerHTML = '';
    for (const [k, [label]] of Object.entries(FONTS)) sel.add(new Option(label, k));
    if (customFontName) sel.add(new Option('My font: ' + customFontName, 'custom'));
    sel.value = S.font === 'custom' && !customFontName ? 'exo2' : (S.font in FONTS || S.font === 'custom' ? S.font : 'exo2');
  }
  $('f-font').addEventListener('input', () => { S.font = $('f-font').value; save(); applyFont(); });
  // uploaded fonts are kept in this browser (IndexedDB) so they survive a reload
  const fontDB = () => new Promise((res, rej) => {
    const r = indexedDB.open('intro-template-fonts', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function storeFont(name, buf) {
    try { const db = await fontDB(); db.transaction('f', 'readwrite').objectStore('f').put({ name, buf }, 'custom'); } catch (e) {}
  }
  async function loadStoredFont() {
    try {
      const db = await fontDB();
      const rec = await new Promise(res => { const q = db.transaction('f').objectStore('f').get('custom'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
      if (rec && rec.buf) await useFontBuffer(rec.name, rec.buf, false);
    } catch (e) {}
  }
  async function useFontBuffer(name, buf, select) {
    const face = new FontFace(CUSTOM_FAMILY, buf);
    await face.load();
    for (const f of [...document.fonts]) if (f.family.replace(/"/g, '') === CUSTOM_FAMILY && f !== face) document.fonts.delete(f);
    document.fonts.add(face);
    customFontName = name;
    if (select) { S.font = 'custom'; save(); }
    buildFontMenu(); applyFont();
  }
  $('f-fontfile').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const name = file.name.replace(/\.(ttf|otf|woff2?)$/i, '');
    try {
      const buf = await file.arrayBuffer();
      await useFontBuffer(name, buf, true);
      storeFont(name, buf);
    } catch (err) {
      $('fontNote').textContent = "Couldn't read that font file. Try a .ttf, .otf, .woff or .woff2.";
    }
    e.target.value = '';
  });
  buildFontMenu(); applyFont(); loadStoredFont();

  // ---------- start ----------
  // transition sound upload
  $('f-tfile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    $('tfileNote').textContent = 'Loading ' + f.name + '…';
    try { await useTransFile(f.name, await f.arrayBuffer(), true); }
    catch (err) { $('tfileNote').textContent = "That audio file couldn't be read. Try an MP3 or WAV."; }
    e.target.value = '';
  });
  addEventListener('load', () => setTimeout(loadTransFile, 200));
  // get the chosen voice ready quietly in the background once the page has loaded
  addEventListener('load', () => setTimeout(() => {
    if (!S.voice) return;
    if (S.vtype === 'human') loadHumanEngine(); else loadVoiceEngine().catch(() => {});
    prepSoon();
  }, 300));
  setSize();
  $('zoneRow').hidden = !S.zones;
  buildColorPickers();
  TL = buildTimeline(); idleT = idleTime();
  requestAnimationFrame(frame);

  (async () => {
    if (canRecord) $('saveBtn').hidden = false;
  })();
</script>
</body>
</html>
