<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Intro Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ui-bg: #111; --ui-panel: #181818; --ui-line: #333;
    --ui-text: #eee; --ui-muted: #999; --accent: #00ff66;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; color: #fff; overflow: hidden; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

  .toolbar {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; transition: opacity .3s; flex-wrap: nowrap;
  }
  .btn {
    font: 600 15px/1 "Inter", system-ui, sans-serif; white-space: nowrap;
    background: var(--ui-bg); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 999px;
    padding: 11px 18px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn[hidden] { display: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden-ui .toolbar, .hidden-ui .panel { opacity: 0; pointer-events: none; }

  .status {
    position: fixed; z-index: 11; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top, 0px));
    background: rgba(17,17,17,.92); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 999px;
    padding: 8px 16px; font-size: 14px; max-width: 92vw; text-align: center;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .status.show { opacity: 1; }
  .status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; margin-right: 7px; vertical-align: 0; }

  .panel {
    position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: min(420px, 100vw);
    background: var(--ui-panel); color: var(--ui-text); border-left: 1px solid var(--ui-line);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(90px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; transform: translateX(105%); transition: transform .3s ease, opacity .3s;
  }
  .panel.open { transform: none; }
  .panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .panel h2 { font: 600 18px "Inter", sans-serif; margin: 0; }
  .panel p.note { color: var(--ui-muted); font-size: 13px; margin: 4px 0 14px; line-height: 1.45; }
  fieldset { border: 1px solid var(--ui-line); border-radius: 12px; padding: 12px 14px 14px; margin: 0 0 14px; }
  legend { padding: 0 6px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  label { display: block; font-size: 13px; color: var(--ui-muted); margin: 10px 0 5px; }
  input[type=text], textarea, select {
    width: 100%; background: #0c0c0c; color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 8px; padding: 9px 10px; font: 15px "Inter", sans-serif;
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .row[hidden] { display: none; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ui-text); font-size: 14px; margin-top: 10px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 36px; border: 1px solid var(--ui-line); background: none; border-radius: 8px; padding: 2px; flex: 0 0 44px; }
  .preview {
    position: sticky; top: calc(-18px - env(safe-area-inset-top, 0px)); z-index: 2;
    background: var(--ui-panel); margin: 0 -20px 14px; padding: 10px 20px 12px;
    border-bottom: 1px solid var(--ui-line);
  }
  #mini { display: block; width: 100%; max-height: 34vh; object-fit: contain; background: #000; border: 1px solid var(--ui-line); border-radius: 8px; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button {
    flex: 1; font: 600 13px "Inter", sans-serif; padding: 8px 6px; border-radius: 8px; cursor: pointer;
    background: #0c0c0c; color: var(--ui-muted); border: 1px solid var(--ui-line);
  }
  .tabs button[aria-pressed="true"] { color: #000; background: var(--accent); border-color: var(--accent); }
  .preview .off { color: var(--ui-muted); font-size: 12px; margin-top: 6px; min-height: 1em; }
  .mcolors { display: grid; gap: 8px; margin-bottom: 8px; }
  .mrow input[type=color] { width: 36px; flex: none; }
  .mrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1.5fr) 2.2em 26px; align-items: center; gap: 8px;
    background: #0c0c0c; border: 1px solid var(--ui-line); border-radius: 8px; padding: 4px 10px 4px 4px; font-size: 14px; }
  .mrow .nm { min-width: 0; padding: 6px 8px; font-size: 14px; }
  .mrow .del { background: none; border: none; color: var(--ui-muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px; border-radius: 6px; }
  .mrow .del:focus-visible { outline: 2px solid var(--accent); }
  .mrow output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ui-muted); }
  /* while editing: big preview on top, settings underneath */
  :root { --pv-h: 58vh; }
  @media (max-width: 699px) { :root { --pv-h: 46vh; } }
  body.editing #mini { display: none; }
  body.editing #stage { bottom: auto; height: calc(var(--pv-h) - 64px); }
  body.editing .panel {
    top: var(--pv-h); width: 100vw; left: 0; right: 0;
    border-left: none; border-top: 1px solid var(--ui-line);
    padding-top: 0; transform: none;
  }
  body.editing .preview { top: 0; padding-top: 12px; }
  body.editing .panel > * { max-width: 1100px; margin-left: auto; margin-right: auto; }
  body.editing .panel > .preview { margin-left: -20px; margin-right: -20px; max-width: none; padding-left: max(20px, calc((100vw - 1100px) / 2)); padding-right: max(20px, calc((100vw - 1100px) / 2)); }
  body.editing .panel header { padding-top: 12px; }
  @media (min-width: 900px) {
    body.editing .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; align-items: start; }
  }
  body.editing .toolbar { top: calc(var(--pv-h) - 56px); bottom: auto; }
  .preview .off:empty { display: none; }
  label.hasval { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  label .val { color: var(--ui-text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .file { font-size: 13px; color: var(--ui-muted); margin-top: 6px; }
  .reset { background: none; border: none; color: var(--ui-muted); text-decoration: underline; cursor: pointer; font: 13px "Inter", sans-serif; padding: 0; }
  @media (prefers-reduced-motion: reduce) { .panel, .toolbar, .status { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Intro preview"></canvas>
<div class="status" id="status" role="status" aria-live="polite"></div>

<div class="toolbar">
  <button class="btn primary" id="playBtn" type="button">▶ Play</button>
  <button class="btn" id="saveBtn" type="button" hidden>⬇ Save MP4</button>
  <button class="btn" id="editBtn" type="button">Edit</button>
</div>
<aside class="panel ui" id="panel" aria-label="Template settings">
  <header>
    <h2>Edit intro</h2>
    <button class="btn" id="closeBtn" type="button">Done</button>
  </header>
  <div class="preview">
    <canvas id="mini" aria-label="Live preview of your changes"></canvas>
    <div class="tabs" role="group" aria-label="Preview part">
      <button type="button" data-pv="1" aria-pressed="true">1 · Title</button>
      <button type="button" data-pv="2" aria-pressed="false">2 · Briefing</button>
      <button type="button" data-pv="3" aria-pressed="false">3 · Model</button>
    </div>
    <div class="off" id="pvNote"></div>
  </div>
  <p class="note">The screen updates as you type. Press Play to watch the whole thing, or Save MP4 to record it for Premiere.</p>

  <div class="fields">
  <fieldset>
    <legend>Video size</legend>
    <select id="f-format" data-k="format" aria-label="Video size">
      <option value="land">Landscape 1920 × 1080</option>
      <option value="port">Portrait 1080 × 1920</option>
    </select>
  </fieldset>

  <fieldset data-part="1">
    <legend><input type="checkbox" data-k="s1on" aria-label="Include title card"> 1 · Title card</legend>
    <label for="f-top">Top line</label>
    <input id="f-top" type="text" data-k="top">
    <label for="f-label">Label</label>
    <input id="f-label" type="text" data-k="label">
    <label for="f-title">Title</label>
    <input id="f-title" type="text" data-k="title">
    <label class="check"><input type="checkbox" data-k="dots"> Add dots between letters (g.u.m…)</label>
  </fieldset>

  <fieldset data-part="2">
    <legend><input type="checkbox" data-k="s2on" aria-label="Include briefing"> 2 · Briefing</legend>
    <label for="f-brief">Text — each line types on its own row</label>
    <textarea id="f-brief" data-k="brief"></textarea>
    <label class="check"><input type="checkbox" data-k="voice"> A voice reads the briefing</label>
    <label for="f-vtype">Voice</label>
    <select id="f-vtype" data-k="vtype">
      <option value="natural">Natural voice (your device's voice, preview only)</option>
      <option value="computer">Computer voice (records into the MP4)</option>
      <option value="file">My own recording (records into the MP4)</option>
    </select>
    <div id="vfileRow" hidden>
      <label for="f-vfile">Voice-over file (.mp3, .wav, .m4a)</label>
      <input id="f-vfile" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg">
    </div>
    <div class="row">
      <button class="btn" id="testVoice" type="button" style="flex:0 0 auto">▶ Test voice</button>
      <div class="file" id="voiceNote" role="status" style="margin:0">Tap Test voice to hear it.</div>
    </div>
  </fieldset>

  <fieldset data-part="3">
    <legend><input type="checkbox" data-k="s3on" aria-label="Include model reveal"> 3 · Model reveal</legend>
    <label for="f-head">Heading — each line on its own row</label>
    <textarea id="f-head" data-k="head" style="min-height:80px"></textarea>
    <label class="check"><input type="checkbox" data-k="statsOn"> Show stat readouts</label>
    <label for="f-layout">Meter layout</label>
    <select id="f-layout" data-k="layout">
      <option value="column">Column of bars</option>
      <option value="group">Group of 4 + big power meter</option>
    </select>
    <div class="row">
      <div><label for="f-pwx">Big meter ← →</label><input id="f-pwx" type="range" min="-50" max="85" step="1" data-k="pwX"></div>
      <div><label for="f-pwy">Big meter ↑ ↓</label><input id="f-pwy" type="range" min="-50" max="40" step="1" data-k="pwY"></div>
    </div>
    <div class="row">
      <div><label for="f-grx">Group ← →</label><input id="f-grx" type="range" min="-70" max="30" step="1" data-k="grX"></div>
      <div><label for="f-gry">Group ↑ ↓</label><input id="f-gry" type="range" min="-50" max="40" step="1" data-k="grY"></div>
    </div>
    <button class="reset" id="resetPos" type="button">Reset meter positions</button>
    <label class="check"><input type="checkbox" data-k="zones"> Split the power meter into 3 sections</label>
    <div class="row" id="zoneRow">
      <div style="flex:0 0 auto"><label for="f-z1">Low</label><input id="f-z1" type="color" data-k="z1"></div>
      <div style="flex:0 0 auto"><label for="f-z2">Middle</label><input id="f-z2" type="color" data-k="z2"></div>
      <div style="flex:0 0 auto"><label for="f-z3">High</label><input id="f-z3" type="color" data-k="z3"></div>
      <div></div>
    </div>
    <label>Meters — name one "power" to put it on the big meter (up to 6)</label>
    <div class="mcolors" id="meterColors"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="addMeter" type="button" style="flex:0 0 auto">+ Add meter</button>
      <button class="reset" id="matchColors" type="button" style="flex:0 0 auto">Match all to the line color</button>
    </div>
    <label for="f-file">Model file (.stl, .obj or .glb)</label>
    <input id="f-file" type="file" accept=".stl,.obj,.glb">
    <div class="file" id="fileName">Using placeholder cube</div>
    <div class="row">
      <div>
        <label for="f-view">Starting view</label>
        <select id="f-view" data-k="view">
          <option value="front">Front</option>
          <option value="back">Back</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
        </select>
      </div>
      <div>
        <label for="f-tilt">Camera tilt</label>
        <input id="f-tilt" type="range" min="0" max="60" step="1" data-k="tilt">
      </div>
    </div>
    <label for="f-mscale">Model size</label>
    <input id="f-mscale" type="range" min="30" max="200" step="5" data-k="mscale">
    <label for="f-bg">Background</label>
    <select id="f-bg" data-k="bg">
      <option value="grid">Gray grid</option>
      <option value="black">Plain black</option>
      <option value="key">Green screen (for keying)</option>
    </select>
    <div class="row">
      <div>
        <label for="f-spin">Full turn time</label>
        <input id="f-spin" type="range" min="3" max="15" step="0.5" data-k="turn">
      </div>
      <div style="flex:0 0 auto">
        <label for="f-color">Line color</label>
        <input id="f-color" type="color" data-k="color">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Timing</legend>
    <label for="f-speed">Typing speed</label>
    <input id="f-speed" type="range" min="0.4" max="2.5" step="0.1" data-k="speed">
    <label for="f-hold">Pause between scenes</label>
    <input id="f-hold" type="range" min="0.5" max="5" step="0.1" data-k="hold">
  </fieldset>

  <button class="reset" id="resetBtn" type="button">Reset to example text</button>
  </div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"Exo 2", "Trebuchet MS", Arial, sans-serif';

  // ---------- settings ----------
  const DEFAULTS = {
    format: 'land',
    s1on: true, top: 'ayelit presents', label: 'operation:', title: 'gumzooka', dots: true,
    s2on: true, brief: 'warning -\nsticky\ngum\nlauncher -\nhandle\nwith\ncare.',
    s3on: true, head: 'model\nfile -', statsOn: true, meterColors: [], layout: 'group', pwX: 0, pwY: 0, grX: 0, grY: 0, stats: 'power: 85\nrange: 60\nstability: 72\naccuracy: 90\nspeed: 55', bg: 'grid', turn: 6, view: 'front', tilt: 20, mscale: 100, zones: true, z1: '#4fc3ff', z2: '#b06bff', z3: '#ff4fa3', color: '#39ff6a',
    speed: 1, hold: 1.4, voice: true, vtype: 'natural',
    sfx: true, sfxVol: 0.7, musicVol: 0.6
  };
  let S = { ...DEFAULTS };
  try { Object.assign(S, JSON.parse(localStorage.getItem('intro-template') || '{}')); } catch (e) {}
  if (typeof S.statsOn !== 'boolean') { S.statsOn = DEFAULTS.statsOn; S.stats = DEFAULTS.stats; }
  for (const k of ['pwX','pwY','grX','grY']) if (typeof S[k] !== 'number') S[k] = 0;
  if (!Array.isArray(S.meterColors)) S.meterColors = [];
  if (!S.layout) { S.layout = DEFAULTS.layout; if (S.stats === 'power: 85\nrange: 60\nstability: 72\naccuracy: 90') S.stats = DEFAULTS.stats; }
  if (typeof S.mscale !== 'number') S.mscale = 100;
  if (typeof S.voice !== 'boolean') S.voice = true;
  if (!S.vtype) S.vtype = 'natural';
  if (typeof S.zones !== 'boolean') { S.zones = DEFAULTS.zones; S.z1 = DEFAULTS.z1; S.z2 = DEFAULTS.z2; S.z3 = DEFAULTS.z3; }
  if (!S.view) S.view = 'front';
  if (typeof S.tilt !== 'number') S.tilt = 20;
  if (typeof S.turn !== 'number') S.turn = DEFAULTS.turn;
  delete S.spin;
  if (S.color === '#9a9a9a') S.color = DEFAULTS.color;
  S.sfx = true; S.sfxVol = 0.7; S.musicVol = 0.6; delete S.keys;
  const save = () => { try { localStorage.setItem('intro-template', JSON.stringify(S)); } catch (e) {} };

  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    const FMT = {
      speed: v => (+v).toFixed(1) + '×', hold: v => (+v).toFixed(1) + ' s', turn: v => (+v).toFixed(1) + ' s',
      tilt: v => v + '°', mscale: v => v + '%',
      pwX: v => (v > 0 ? '+' : '') + v, pwY: v => (v > 0 ? '+' : '') + v, grX: v => (v > 0 ? '+' : '') + v, grY: v => (v > 0 ? '+' : '') + v
    };
    let val = null;
    if (el.type === 'range') {
      const lab = document.querySelector('label[for="' + el.id + '"]');
      if (lab) { lab.classList.add('hasval'); val = document.createElement('span'); val.className = 'val'; lab.appendChild(val); }
    }
    const show = () => { if (val) val.textContent = (FMT[k] || (v => v))(el.value); };
    el.addEventListener('input', show);
    const set = () => { if (el.type === 'checkbox') el.checked = !!S[k]; else el.value = S[k]; show(); };
    set(); el._set = set;
    el.addEventListener('input', () => {
      S[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? parseFloat(el.value) : el.value;
      save(); onSettingsChange(k);
    });
  });
  $('resetPos').addEventListener('click', () => {
    for (const k of ['pwX','pwY','grX','grY']) S[k] = 0;
    save(); document.querySelectorAll('[data-k]').forEach(el => el._set());
  });
  // meters live as a list; S.stats keeps them as "name: value" lines
  const getMeters = () => parseStats().map(st => ({ name: st.name, v: Math.round(st.v) }));
  function setMeters(list, rebuild) {
    S.stats = list.map(m => (m.name || 'meter') + ': ' + m.v).join('\n'); save();
    if (rebuild) buildColorPickers();
    if (!playing) { TL = buildTimeline(); idleT = idleTime(); }
  }
  function buildColorPickers() {
    const box = $('meterColors'); box.innerHTML = '';
    const list = getMeters();
    $('addMeter').disabled = list.length >= 6;
    if (!list.length) { box.textContent = 'No meters yet — tap + Add meter.'; return; }
    list.forEach((m, i) => {
      const st = { i };
      const row = document.createElement('div'); row.className = 'mrow';
      const col = document.createElement('input'); col.type = 'color';
      col.value = colorOf(st); col.setAttribute('aria-label', 'Color for ' + m.name);
      col.addEventListener('input', () => { S.meterColors[i] = col.value; save(); });
      const nm = document.createElement('input'); nm.type = 'text'; nm.className = 'nm'; nm.value = m.name;
      nm.setAttribute('aria-label', 'Meter name');
      nm.addEventListener('input', () => { const l = getMeters(); l[i].name = nm.value.replace(/[:\n]/g, '').trim().toLowerCase(); setMeters(l, false); });
      const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 100; sl.step = 1;
      sl.value = m.v; sl.setAttribute('aria-label', 'Level for ' + m.name);
      const out = document.createElement('output'); out.textContent = m.v;
      sl.addEventListener('input', () => { out.textContent = sl.value; const l = getMeters(); l[i].v = +sl.value; setMeters(l, false); });
      const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '×';
      del.setAttribute('aria-label', 'Remove ' + m.name);
      del.addEventListener('click', () => {
        const l = getMeters(); l.splice(i, 1);
        S.meterColors.splice(i, 1);
        setMeters(l, true);
      });
      row.append(col, nm, sl, out, del); box.append(row);
    });
  }
  $('addMeter').addEventListener('click', () => {
    const l = getMeters(); if (l.length >= 6) return;
    l.push({ name: 'meter ' + (l.length + 1), v: 50 }); setMeters(l, true);
    const rows = document.querySelectorAll('.mrow .nm'); rows[rows.length - 1].focus(); rows[rows.length - 1].select();
  });
  $('matchColors').addEventListener('click', () => { S.meterColors = []; save(); buildColorPickers(); });
  $('resetBtn').addEventListener('click', () => {
    S = { ...DEFAULTS, meterColors: [] }; save(); buildColorPickers(); applyView();
    document.querySelectorAll('[data-k]').forEach(el => el._set());
    onSettingsChange('format');
  });

  const titleText = () => S.dots ? S.title.replace(/\s+/g, '').split('').join('.') + '.' : S.title;
  const splitLines = txt => txt.split('\n').map(s => s.trim()).filter(Boolean);

  // ---------- canvas + 3D ----------
  const canvas = $('stage');
  const ctx = canvas.getContext('2d');
  let W = 1920, H = 1080;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  const scene = new THREE.Scene();

    key(at, soft) {
      noiseHit(at, { type: 'highpass', freq: 3800, q: 0.7, peak: soft ? 0.18 : 0.3, decay: 0.012 });
      tone(at, { wave: 'square', freq: soft ? 1050 : pick([1400, 1600, 1800, 2100]), peak: 0.035, attack: 0.001, decay: 0.025, lp: 6000 });
      tone(at + 0.004, { freq: 3200, to: 1500, peak: 0.04, attack: 0.001, decay: 0.015 });
    },
    lineStart(at, dur) { // quiet data warble under each line while it types
      const o = keep(actx.createOscillator()); o.type = 'square';
      for (let t = 0; t < dur; t += 0.04) o.frequency.setValueAtTime(pick([220, 330, 440, 660, 880]), at + t);
      const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.02, at + 0.02);
      g.gain.setValueAtTime(0.02, at + Math.max(dur - 0.03, 0.02)); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(f).connect(g).connect(sfxBus); o.start(at); o.stop(at + dur + 0.02);
    }
  };
  const keyset = () => TYPING;

  function blip(at) {
    const o = keep(actx.createOscillator()); o.type = 'square'; o.frequency.value = 1180;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2500;
    const g = actx.createGain(); env(g, at, 0.08, 0.005, 0.09);
    o.connect(f).connect(g).connect(sfxBus); o.start(at); o.stop(at + 0.12);
  }
  function whoosh(at, dur) {
    const src = keep(actx.createBufferSource()); src.buffer = noise; src.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(250, at); bp.frequency.exponentialRampToValueAtTime(3500, at + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + dur * 0.85); g.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.05);
    src.connect(bp).connect(g).connect(sfxBus); src.start(at); src.stop(at + dur + 0.1);
  }
  function pop(at) {
    const o = keep(actx.createOscillator()); o.type = 'sine';
    o.frequency.setValueAtTime(520, at); o.frequency.exponentialRampToValueAtTime(90, at + 0.22);
    const g = actx.createGain(); env(g, at, 0.6, 0.004, 0.3);
    o.connect(g).connect(sfxBus); o.start(at); o.stop(at + 0.35);
  }
  // ---------- computer voice (SAM speech synth, rendered into the page's own audio so it records) ----------
  let voiceReady = null, voiceCache = { key: '', bufs: null };
  const briefSpeech = () => splitLines(S.brief).join(' ').replace(/\s+-(\s|$)/g, ', ').replace(/\s+/g, ' ').trim();
  function loadVoiceEngine() {
    if (window.SamJs) return Promise.resolve();
    if (voiceReady) return voiceReady;
    voiceReady = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/sam-js@0.3.1/dist/samjs.min.js'; sc.async = true;
      sc.onload = () => window.SamJs ? res() : rej(new Error('engine'));
      sc.onerror = () => rej(new Error('engine'));
      document.head.appendChild(sc);
    });
    voiceReady.catch(() => { voiceReady = null; });
    return voiceReady;
  }
  const lineSpeech = l => l.replace(/\s+-\s*$/, '').replace(/\s+-\s+/g, ', ').trim();
  function voiceClips() {
    return voiceCache.key === S.brief && voiceCache.bufs ? voiceCache.bufs : null;
  }
  const voiceClip = () => { const c = voiceClips(); return c && c.find(Boolean) || null; };
  function phrases(text) {
    const clean = text.replace(/[^a-zA-Z0-9 ,.?!']/g, ' ').replace(/\s+/g, ' ').trim();
    const out = []; let cur = '';
    for (const w of clean.split(' ').filter(Boolean)) {
      if ((cur + ' ' + w).length > 60 && cur) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
    }
    if (cur) out.push(cur);
    return out;
  }
  async function prepareVoice() {
    if (!S.voice || !S.s2on || S.vtype !== 'computer') return true;
    const lines = splitLines(S.brief); if (!lines.length) return true;
    const ready = () => { const d = voiceCache.bufs.reduce((n, b) => n + (b ? b.duration : 0), 0);
      $('voiceNote').textContent = 'Computer voice ready (' + d.toFixed(1) + ' s). It records into the MP4.'; };
    if (voiceClips()) { ready(); return true; }
    const ac = audio(); if (!ac) return false;
    try {
      await loadVoiceEngine();
      const voiceFor = (i, n) => new window.SamJs({ speed: 95, pitch: i === n - 1 ? 44 : [40, 42, 41][i % 3], throat: 140, mouth: 150 });
      const RATE = 22050, gap = Math.round(RATE * 0.2);
      const bufs = lines.map((line, li) => {
        const sam = voiceFor(li, lines.length);
        const chunks = [];
        for (const ph of phrases(lineSpeech(line))) { const b = sam.buf32(ph.toUpperCase()); if (b && b.length) chunks.push(b); }
        if (!chunks.length) return null;
        const len = chunks.reduce((n, c) => n + c.length + gap, 0) - gap;
        const buf = ac.createBuffer(1, len, RATE), d = buf.getChannelData(0);
        let o = 0, peak = 0;
        for (const c of chunks) { d.set(c, o); o += c.length + gap; }
        for (let k = 0; k < d.length; k++) peak = Math.max(peak, Math.abs(d[k]));
        if (peak > 0) for (let k = 0; k < d.length; k++) d[k] = d[k] / peak * 0.9;
        return buf;
      });
      if (!bufs.some(Boolean)) throw new Error('empty');
      voiceCache = { key: S.brief, bufs };
      ready();
      voiceFallback = false;
      return true;
    } catch (e) {
      voiceFallback = !!window.speechSynthesis;
      const why = e && e.message === 'engine' ? "the voice engine didn't download" : 'the voice engine failed (' + (e && e.message || e) + ')';
      $('voiceNote').textContent = voiceFallback
        ? 'Using your browser\'s built-in voice because ' + why + '. It plays in preview but won\'t be in the MP4.'
        : 'No voice available: ' + why + '.';
      return false;
    }
  }
  let voiceFallback = false, voiceTimer = null, voiceTimers = [], voiceFileBuf = null;
  function pickNaturalVoice() {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    const en = vs.filter(v => /^en/i.test(v.lang));
    const prefs = [/natural/i, /aria|jenny|michelle|ava|emma/i, /google us english/i, /samantha|allison|susan/i, /zira|hazel|karen|victoria|female/i];
    for (const re of prefs) { const v = en.find(v => re.test(v.name)); if (v) return v; }
    return en[0] || null;
  }
  try { window.speechSynthesis && speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
  function browserSpeak(text, queue) {
    try {
      if (!queue) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.1; u.pitch = 1.05; u.volume = 1;
      const v = pickNaturalVoice(); if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  let _room = null;
  function roomIR() {
    if (_room) return _room;
    const len = Math.round(actx.sampleRate * 0.55);
    _room = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = _room.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    return _room;
  }
  function speakAt(at, buf) {
    const src = keep(actx.createBufferSource()); src.buffer = buf;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3400; lp.Q.value = 0.6;
    const warm = actx.createBiquadFilter(); warm.type = 'peaking'; warm.frequency.value = 900; warm.gain.value = 3; warm.Q.value = 0.8;
    const out = actx.createGain(); out.gain.value = 0.95;
    src.connect(hp).connect(lp).connect(warm).connect(out).connect(master);
    // soft double a hair out of tune and time, smooths the robotic edge
    const dbl = keep(actx.createBufferSource()); dbl.buffer = buf; dbl.playbackRate.value = 1.004;
    const dg = actx.createGain(); dg.gain.value = 0.3;
    dbl.connect(dg).connect(lp);
    // small room
    const rv = actx.createConvolver(); rv.buffer = roomIR();
    const wet = actx.createGain(); wet.gain.value = 0.16;
    warm.connect(rv).connect(wet).connect(master);
    src.start(at); dbl.start(at + 0.012);
  }

  function scheduleSound(t0) {
    if (!actx) return;
    seed = 7;
    for (const seg of TL.segs) {
      blip(t0 + (seg.start + 120) / 1000);
      const ks = keyset();
      for (const l of seg.lines) {
        // soft readout blip as each letter appears
        l.text.split('').forEach((ch, i) => {
          if (ch === ' ') return;
          const at = t0 + l.times[i] / 1000;
          tone(at, { freq: ch === '.' ? 1320 : pick([1760, 1976, 2093]), peak: 0.05, attack: 0.002, decay: 0.03 });
        });
        // beep each time the cursor blinks on at the end of a finished line (up to 3 per line)
        if (l.times.length) {
          const li = seg.lines.indexOf(l), next = seg.lines[li + 1];
          const from = l.times[l.times.length - 1] + 60, until = next ? next.t0 : seg.end;
          let m = Math.ceil(from / 900), n = 0;
          while (m * 900 < until - 80 && n < 3) {
            tone(t0 + m * 900 / 1000, { wave: 'square', freq: 880, peak: 0.05, attack: 0.003, decay: 0.07, lp: 2400 });
            m++; n++;
          }
        }
        if (ks.lineEnd && l.times.length) ks.lineEnd(t0 + (l.times[l.times.length - 1] + 90) / 1000);
      }
      if (ks.sceneEnd && seg.lines.length) ks.sceneEnd(t0 + (seg.typedEnd + 60) / 1000);
      const delayMs = at => Math.max(0, (t0 - actx.currentTime) * 1000 + at);
      if (seg.n === 2 && S.voice && S.vtype === 'natural' && window.speechSynthesis) {
        try { speechSynthesis.cancel(); } catch (e) {}
        for (const l of seg.lines) if (l.say) voiceTimers.push(setTimeout(() => browserSpeak(l.say, true), delayMs(l.t0)));
      }
      else if (seg.n === 2 && S.voice && S.vtype === 'file' && voiceFileBuf && seg.fileAt != null) {
        const src = keep(actx.createBufferSource()); src.buffer = voiceFileBuf; src.connect(master); src.start(t0 + seg.fileAt / 1000);
      }
      else if (seg.n === 2 && S.voice && S.vtype === 'computer' && voiceClips()) { for (const l of seg.lines) if (l.clip) speakAt(t0 + l.t0 / 1000, l.clip); }
      else if (seg.n === 2 && S.voice && S.vtype === 'computer' && voiceFallback && seg.lines.length) {
        clearTimeout(voiceTimer);
        const text = briefSpeech();
        voiceTimer = setTimeout(() => browserSpeak(text), Math.max(0, (t0 - actx.currentTime) * 1000 + seg.lines[0].t0));
      }
      if (seg.n === 3) { whoosh(t0 + seg.modelStart / 1000 - 0.45, 0.45); pop(t0 + seg.modelStart / 1000); }
    }
    if (musicBuf) {
      const src = keep(actx.createBufferSource()); src.buffer = musicBuf;
      const g = actx.createGain(); const end = t0 + TL.total / 1000;
      g.gain.setValueAtTime(1, t0); g.gain.setValueAtTime(1, Math.max(t0, end - 1)); g.gain.linearRampToValueAtTime(0.0001, end);
      src.connect(g).connect(musicBus); src.start(t0); src.stop(end + 0.05);
    }
  }
  function silence() {
    clearTimeout(voiceTimer); voiceTimers.forEach(clearTimeout); voiceTimers = []; try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
    live.forEach(n => { try { n.stop(); } catch (e) {} });
    live = [];
  }


  // ---------- playback + recording ----------
  let playing = false, playStart = 0, idleT = 0, recorder = null, onDone = null;

  let pvPart = 1;
  const panelOpen = () => $('panel').classList.contains('open');
  function idleTime() {
    if (!TL.segs.length) return 0;
    let s = TL.segs[0];
    if (panelOpen()) {
      const want = TL.segs.find(x => x.n === pvPart);
      $('pvNote').textContent = want ? '' : 'This part is switched off — tick its box to include it.';
      if (want) s = want;
    }
    return s.n === 3 ? s.modelStart + 4800 : s.typedEnd;
  }
  function setPreview(n) {
    pvPart = n;
    document.querySelectorAll('[data-pv]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.pv === n)));
    TL = buildTimeline(); idleT = idleTime();
  }
  document.querySelectorAll('[data-pv]').forEach(b => b.addEventListener('click', () => setPreview(+b.dataset.pv)));
  document.querySelectorAll('fieldset[data-part]').forEach(f => f.addEventListener('focusin', () => {
    const n = +f.dataset.part; if (n !== pvPart) setPreview(n);
  }));
  new MutationObserver(() => { document.body.classList.toggle('editing', panelOpen()); $('editBtn').textContent = panelOpen() ? 'Done' : 'Edit'; })
    .observe($('panel'), { attributes: true, attributeFilter: ['class'] });
  const mini = $('mini'), mctx = mini.getContext('2d');
  function drawMini() {
    const w = 640, h = Math.round(640 * H / W);
    if (mini.width !== w || mini.height !== h) { mini.width = w; mini.height = h; }
    mctx.drawImage(canvas, 0, 0, w, h);
  }
  function onSettingsChange(k) {
    if (k === 'color') { material.color.set(S.color); buildColorPickers(); }
    if (k === 'sfx' || k === 'sfxVol' || k === 'musicVol') applyVolumes();
    if (k === 'format') setSize();
    if (k === 'view' || k === 'tilt') applyView();
    if (k === 'zones') $('zoneRow').hidden = !S.zones;
    if (!playing) { TL = buildTimeline(); idleT = idleTime(); }
  }

  function frame(now) {
    let t = idleT;
    if (playing) {
      t = Math.max(0, now - playStart);
      if (t >= TL.total) { t = TL.total; playing = false; const cb = onDone; onDone = null; draw(t); cb && cb(); }
    }
    draw(t);

    requestAnimationFrame(frame);
  }

  function status(html, ms) {
    const el = $('status');
    el.innerHTML = html; el.classList.add('show');
    clearTimeout(status._t);
    if (ms) status._t = setTimeout(() => el.classList.remove('show'), ms);
  }
  const hideStatus = () => $('status').classList.remove('show');

  async function playWithVoice(done) {
    audio(); if (actx && actx.state === 'suspended') actx.resume();
    await prepareVoice();
    play(done);
  }
  function play(done) {
    $('panel').classList.remove('open');
    document.body.classList.add('hidden-ui');
    TL = buildTimeline();
    silence();
    const ac = audio();
    const lead = 0.08;
    if (ac) { if (ac.state === 'suspended') ac.resume(); scheduleSound(ac.currentTime + lead); }
    playStart = performance.now() + lead * 1000;
    playing = true;
    onDone = () => { document.body.classList.remove('hidden-ui'); idleT = idleTime(); done && done(); };
  }
  function stop() {
    if (!playing) return;
    playing = false; onDone = null;
    silence();
    if (recorder && recorder.state !== 'inactive') { recorder._cancelled = true; recorder.stop(); }
    document.body.classList.remove('hidden-ui');
    idleT = idleTime(); hideStatus();
  }

  const MIMES = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp9', 'video/webm'];
  const canRecord = typeof MediaRecorder !== 'undefined' && !!canvas.captureStream;
  const pickMime = () => MIMES.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';

  let downloads = null;
  async function exportVideo() {
    if (!TL.segs.length) { status('Turn on at least one part first.', 3000); return; }
    const mime = pickMime();
    if (!mime) { status("This browser can't record video — try Chrome, Edge or Safari.", 5000); return; }
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const chunks = [];
    audio();
    if (actx && actx.state === 'suspended') await actx.resume();
    await prepareVoice();
    const video = canvas.captureStream(30);
    const stream = new MediaStream([...video.getVideoTracks(), ...(recDest ? recDest.stream.getAudioTracks() : [])]);
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 192_000 });
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const rec = recorder;
    rec.onstop = async () => {
      video.getTracks().forEach(tr => tr.stop());
      recorder = null;
      if (rec._cancelled) { status('Recording stopped.', 2500); return; }
      const blob = new Blob(chunks, { type: mime.split(';')[0] });
      const name = (S.title.trim() || 'intro').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-intro.' + ext;
      status('Saving video…');
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        status(ext === 'mp4' ? 'Saved ' + name : 'Saved ' + name + " — this browser can't make MP4; use Chrome, Edge or Safari for MP4.", 5000);
      } catch (err) { status("Saving isn't available in this browser.", 4000); }
    };
    status('<span class="dot"></span>Recording — keep this screen open');
    rec.start(250);
    // draw the first frame before timing starts so the video doesn't open on a stale frame
    play(() => { setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 300); });
  }

  $('playBtn').addEventListener('click', () => playWithVoice());
  const syncVoiceUI = () => { $('vfileRow').hidden = S.vtype !== 'file'; $('voiceNote').textContent = 'Tap Test voice to hear it.'; };
  $('f-vtype').addEventListener('input', syncVoiceUI);
  $('f-vfile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    const ac = audio(); if (!ac) return;
    $('voiceNote').textContent = 'Loading ' + f.name + '…';
    try {
      const data = await f.arrayBuffer();
      voiceFileBuf = await new Promise((res, rej) => ac.decodeAudioData(data, res, rej));
      $('voiceNote').textContent = 'Using ' + f.name + ' (' + voiceFileBuf.duration.toFixed(1) + ' s). Re-add it after reloading the page.';
      if (!playing) { TL = buildTimeline(); idleT = idleTime(); }
    } catch (err) { voiceFileBuf = null; $('voiceNote').textContent = "That audio file couldn't be read. Try an MP3 or WAV."; }
  });
  syncVoiceUI();
  $('testVoice').addEventListener('click', async () => {
    const ac = audio(); if (!ac) return;
    unlockAudio();
    silence();
    if (S.vtype === 'natural') {
      if (!window.speechSynthesis) { $('voiceNote').textContent = "This browser has no built-in voice. Pick Computer voice instead."; return; }
      browserSpeak(briefSpeech());
      const v = pickNaturalVoice();
      $('voiceNote').textContent = 'Using ' + (v ? v.name : 'your device voice') + '. It plays in preview; for the MP4 use Computer voice or your own recording.';
      return;
    }
    if (S.vtype === 'file') {
      if (!voiceFileBuf) { $('voiceNote').textContent = 'Choose a voice-over file first.'; return; }
      if (ac.state !== 'running') await ac.resume();
      const src = keep(ac.createBufferSource()); src.buffer = voiceFileBuf; src.connect(master); src.start(ac.currentTime + 0.05);
      $('voiceNote').textContent = 'Playing your recording (' + voiceFileBuf.duration.toFixed(1) + ' s).';
      return;
    }
    if (!window.SamJs && window.speechSynthesis) browserSpeak(briefSpeech());
    $('voiceNote').textContent = 'Loading voice…';
    const was = S.voice; S.voice = true;
    const ok = await prepareVoice(); S.voice = was;
    if (ok && voiceClips()) {
      if (ac.state !== 'running') await ac.resume();
      let at = ac.currentTime + 0.05;
      for (const b of voiceClips()) if (b) { speakAt(at, b); at += b.duration + 0.25; }
    }
  });
  $('saveBtn').addEventListener('click', exportVideo);
  $('editBtn').addEventListener('click', () => {
    if (panelOpen()) { $('closeBtn').click(); return; }
    stop(); $('panel').classList.add('open'); setPreview(pvPart);
  });
  $('closeBtn').addEventListener('click', () => { $('panel').classList.remove('open'); TL = buildTimeline(); idleT = idleTime(); });
  document.addEventListener('pointerdown', e => { if (playing && !e.target.closest('.toolbar')) stop(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });

  // ---------- start ----------
  addEventListener('load', () => setTimeout(() => { if (S.voice) loadVoiceEngine().catch(() => {}); }, 300));
  setSize();
  $('zoneRow').hidden = !S.zones;
  buildColorPickers();
  TL = buildTimeline(); idleT = idleTime();
  requestAnimationFrame(frame);
  (document.fonts ? document.fonts.load(font(64)) : Promise.resolve()).catch(() => {});

  (async () => {
    if (canRecord) $('saveBtn').hidden = false;
  })();
</script>
</body>
</html>
